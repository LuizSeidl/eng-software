<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <header><h1>Cabeçalho da página</h1></header>
    <main>
      <!-- Tabela Simples-->
      <table width="100%" border="1">
        <tr>
          <th>Alex</th>
          <th>HTML</th>
          <th>10</th>
        </tr>
        <tr>
          <td>Célula 1</td>
          <td>Célula 2</td>
          <td>Célula 3</td>
        </tr>
      </table>
      <!--Tabela com Títulos-->
      <table width="100%" border="1">
        <tr>
          <th>Nome</th>
          <th>Disciplina</th>
          <th>Nota</th>
        </tr>
        <tr>
          <td>Alex</td>
          <td>HTML</td>
          <td>10</td>
        </tr>
        <tr>
          <td>Ana</td>
          <td>HTML</td>
          <td>10</td>
        </tr>
      </table>
      <!--Tabela com cabeçalho e rodapé-->
      <table width="100%" border="1">
        <thead>
          <tr>
            <th>Mês</th>
            <th>Horas/Aula</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Junho</td>
            <td>40</td>
          </tr>
          <tr>
            <td>Julho</td>
            <td>30</td>
          </tr>
        </tbody>
        <tfoot>
          <tr>
            <th>Total</th>
            <th>70</th>
          </tr>
        </tfoot>
      </table>
      <!--Tabela com colspan-->
      <table width="100%" border="1">
        <tr>
          <td>Aluno</td>
          <td colspan="2">Disciplina</td>
        </tr>
        <tr>
          <td>Alex</td>
          <td>HTML</td>
          <td>Ambiente Web</td>
        </tr>
      </table>
      <footer><p>Rodapé da página.</p></footer>
    </main>
  </body>
</html>
